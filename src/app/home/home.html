<!-- Sección Hero -->
<header class="hero text-center py-5 ">
  <img src="assets/guille.jpg" alt="Retrato de Guillermo Fuentes, Desarrollador Web Full Stack" class="rounded-circle mb-3"
    style="width: 150px; height: 150px; object-fit: cover;" loading="lazy" decoding="async">
  <h1 class="custom-font">Guillermo Fuentes Buenosvinos</h1>
  <p class="text-muted lead">Desarrollador Web Full Stack</p>
  <div class="mt-4">
    <a href="mailto:fuentesbuenosvinosguillermo@gmail.com" class="btn btn-primary m-2"><i class="bi bi-envelope"></i>
      Contacto</a>
    <a href="https://www.linkedin.com/in/guillermo-fuentes-buenosvinos/" class="btn btn-outline-primary m-2" target="_blank" rel="noopener noreferrer"><i
        class="bi bi-linkedin"></i>
      LinkedIn</a>
    <a href="https://github.com/blackl1ght98" class="btn btn-outline-primary m-2" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i>
      GitHub</a>
  </div>
</header>

<!-- Sección Proyectos -->
<section id="proyectos" class="container py-5">
  <h2 class="section-title text-center mb-5">Mis Proyectos</h2>
  <div class="row g-4">
    <div *ngFor="let project of projects" [class]="colClass(project)">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text">{{ project.shortDescription }}</p>
          <p class="card-text">
            <small class="text-muted">
              <i class="bi bi-stack"></i>
              <ng-container *ngFor="let s of project.stack; let last = last">
                {{ s }}<ng-container *ngIf="!last">, </ng-container>
              </ng-container>
            </small>
          </p>
          <div class="d-flex gap-2 flex-wrap">
            <a *ngIf="project.demoUrl" [href]="project.demoUrl" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
              <i class="bi bi-globe"></i> Ver demo
            </a>
            <a [href]="project.repoUrl" class="btn"
              [class.btn-primary]="!project.demoUrl" [class.btn-outline-primary]="project.demoUrl"
              target="_blank" rel="noopener noreferrer">
              <i class="bi bi-github"></i> Ver repositorio
            </a>
            <a [routerLink]="['/', project.key]" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-right-circle"></i> Detalles
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
