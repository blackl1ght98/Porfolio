<div class="container my-5" *ngIf="project() as p">
  <h1 class="display-4 text-center custom-font">{{ p.title }}</h1>
  <hr class="section-divider">
  <p class="lead text-center">{{ p.longDescription }}</p>

  <section class="mt-5">
    <h2 class="section-title mb-4">Stack</h2>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <strong>Stack:</strong>
        <ng-container *ngFor="let s of p.stack; let last = last">
          {{ s }}<ng-container *ngIf="!last">, </ng-container>
        </ng-container>
      </li>
      <li class="list-group-item">
        <strong>Funcionalidades:</strong> Registro y gestión de tareas, sincronización en la nube, autenticación
        de usuarios.
      </li>
    </ul>
  </section>

  <section class="text-center mt-5">
    <p class="lead">
      Explora la aplicación o el código fuente:
      <a *ngIf="p.demoUrl" [href]="p.demoUrl" target="_blank" rel="noopener noreferrer"
        class="btn btn-primary ms-2"><i class="bi bi-globe"></i> Ver Aplicación</a>
      <a [href]="p.repoUrl" target="_blank" rel="noopener noreferrer"
        class="btn btn-outline-primary ms-2"><i class="bi bi-github"></i> Ver Repositorio</a>
    </p>
  </section>

  <section class="mt-5" *ngIf="p.images.length">
    <div id="carouselTareas" class="carousel slide mb-5" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div *ngFor="let url of p.images; let i = index" class="carousel-item"
          [class.active]="i === 0">
          <img [src]="url" class="d-block w-100 rounded shadow-sm"
            [alt]="'Captura ' + (i+1) + ' del proyecto ' + p.title"
            loading="lazy">
        </div>
      </div>
      <button *ngIf="p.images.length > 1" class="carousel-control-prev" type="button"
        data-bs-target="#carouselTareas" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button *ngIf="p.images.length > 1" class="carousel-control-next" type="button"
        data-bs-target="#carouselTareas" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </section>
</div>
